<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%">
<style>
*{transform-box:fill-box}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes wave{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(22deg)}}
@keyframes fall{0%,15%{transform:translateY(0);opacity:1}85%{transform:translateY(95px);opacity:1}100%{transform:translateY(95px);opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.trunk{transform-origin:50% 100%;animation:grow 2s ease-out both}
.crown{transform-origin:50% 100%;animation:sway 5s ease-in-out 3s infinite}
.leaf{transform-origin:50% 50%;animation:pop 1s ease-out both}
.apple{transform-origin:50% 50%;animation:pop .6s ease-out both}
.arm{transform-origin:50% 100%;animation:wave 1s ease-in-out infinite}
.hi{transform-origin:50% 50%;animation:pop .6s ease-out 1s both}
.drop{animation:fall 6s ease-in 5s infinite}
</style>
<rect width="800" height="420" rx="24" fill="#FBF6EC"/>
<!-- chão -->
<path d="M0 362 Q200 345 400 362 T800 362 V420 H0Z" fill="#A98467"/>
<path d="M0 362 Q200 345 400 362 T800 362 V372 Q600 358 400 372 T0 372Z" fill="#A8C8A0"/>
<ellipse cx="560" cy="366" rx="72" ry="12" fill="#8B6B4E"/>
<!-- árvore -->
<rect class="trunk" x="548" y="200" width="24" height="166" rx="8" fill="#8B6B4E"/>
<g class="crown">
  <circle class="leaf" style="animation-delay:2s" cx="560" cy="165" r="70" fill="#A8C8A0"/>
  <circle class="leaf" style="animation-delay:2.2s" cx="500" cy="205" r="48" fill="#8DB38A"/>
  <circle class="leaf" style="animation-delay:2.4s" cx="620" cy="205" r="48" fill="#8DB38A"/>
  <circle class="leaf" style="animation-delay:2.6s" cx="560" cy="115" r="42" fill="#B9D6B1"/>
  <g fill="#D9645A">
    <circle class="apple" style="animation-delay:3.2s" cx="520" cy="150" r="10"/>
    <circle class="apple" style="animation-delay:3.5s" cx="578" cy="132" r="10"/>
    <circle class="apple" style="animation-delay:3.8s" cx="612" cy="180" r="10"/>
    <circle class="apple" style="animation-delay:4.1s" cx="490" cy="208" r="10"/>
    <circle class="apple" style="animation-delay:4.4s" cx="555" cy="190" r="10"/>
    <circle class="apple" style="animation-delay:4.7s" cx="600" cy="225" r="10"/>
    <circle class="apple" style="animation-delay:5s" cx="535" cy="235" r="10"/>
    <circle class="apple" style="animation-delay:5.3s" cx="636" cy="212" r="10"/>
    <circle class="apple" style="animation-delay:5.6s" cx="545" cy="100" r="10"/>
  </g>
  <circle class="drop" cx="580" cy="262" r="10" fill="#E07B73"/>
</g>
<!-- avatar -->
<rect x="112" y="332" width="12" height="32" rx="6" fill="#8B6B4E"/>
<rect x="136" y="332" width="12" height="32" rx="6" fill="#8B6B4E"/>
<rect x="104" y="245" width="52" height="95" rx="24" fill="#D9645A"/>
<rect x="94" y="252" width="12" height="52" rx="6" fill="#D9645A"/>
<circle cx="100" cy="308" r="7" fill="#F1D3B8"/>
<g class="arm">
  <rect x="154" y="212" width="12" height="48" rx="6" fill="#D9645A"/>
  <circle cx="160" cy="208" r="8" fill="#F1D3B8"/>
</g>
<circle cx="130" cy="215" r="28" fill="#F1D3B8"/>
<path d="M102 214 a28 28 0 0 1 56 0 q-28 -16 -56 0z" fill="#8B6B4E"/>
<circle cx="120" cy="218" r="3" fill="#5C4633"/>
<circle cx="140" cy="218" r="3" fill="#5C4633"/>
<path d="M121 228 q9 8 18 0" stroke="#5C4633" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<circle cx="113" cy="226" r="4" fill="#E07B73" opacity=".5"/>
<circle cx="147" cy="226" r="4" fill="#E07B73" opacity=".5"/>
<!-- balão -->
<g class="hi">
  <rect x="170" y="150" width="70" height="34" rx="17" fill="#fff" stroke="#A8C8A0" stroke-width="2"/>
  <text x="205" y="173" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#6E9A6B">Oi! 🌱</text>
</g>
</svg>
